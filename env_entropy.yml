name: dermlip_entropy
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - transformers=4.51.3
  - xgboost
  - opencv
  - scikit-image
  - ftfy
  - tqdm
  - regex
  - datasets
  - protobuf
  - seaborn
  - jupyter
  - ipykernel
  - ipywidgets
  - wandb
  - pexpect
  - overrides
  - pip
  - pip:
      - --index-url=https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - --extra-index-url=https://pypi.org/simple
      - open-clip-torch
      - git+https://github.com/openai/clip.git
      - git+https://github.com/mmschlk/shapiq.git
      - sentencepiece==0.2.0